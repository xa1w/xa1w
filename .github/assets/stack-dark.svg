<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 200" width="1200" height="200" role="img" aria-label="Stack: HTML, CSS, JavaScript, Tailwind, React, Vite, GSAP, Python, Git, Figma, Vercel, VS Code">
<title>Stack</title>
<defs>
<style>
  .s { font-family: ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,monospace;
        font-size: 14px; letter-spacing: 1.4px; }
  .in { animation: up .7s cubic-bezier(.22,1,.36,1) both; }
  @keyframes up { from { opacity: 0; transform: translateY(10px); } }
  .vrule { transform-origin: 50% 0; animation: growy .8s cubic-bezier(.22,1,.36,1) both; }
  @keyframes growy { from { transform: scaleY(0); } }
  /* the site is still being built, so the caret is still blinking */
  .caret { animation: blink 1.15s steps(1,end) infinite; }
  @keyframes blink { 50% { opacity: 0; } }
  @media (prefers-reduced-motion: reduce) { .in,.vrule,.caret { animation: none; } }
</style>
</defs>

<rect width="1200" height="200" fill="#0C0C0D"/>

<g stroke="#26262A" stroke-width="1" shape-rendering="crispEdges">
  <line class="vrule" x1="52.5"   y1="20" x2="52.5"   y2="180"/>
  <line class="vrule" x1="326.5"  y1="20" x2="326.5"  y2="180" style="animation-delay:.08s"/>
  <line class="vrule" x1="600.5"  y1="20" x2="600.5"  y2="180" style="animation-delay:.16s"/>
  <line class="vrule" x1="874.5"  y1="20" x2="874.5"  y2="180" style="animation-delay:.24s"/>
  <line class="vrule" x1="1147.5" y1="20" x2="1147.5" y2="180" style="animation-delay:.32s"/>
</g>

  <text class="s in" x="68" y="62" fill="#EFEEEB" style="animation-delay:0.00s">HTML</text>
  <text class="s in" x="68" y="106" fill="#EFEEEB" style="animation-delay:0.06s">CSS</text>
  <text class="s in" x="68" y="150" fill="#EFEEEB" style="animation-delay:0.12s">JAVASCRIPT</text>
  <text class="s in" x="342" y="62" fill="#EFEEEB" style="animation-delay:0.10s">TAILWIND</text>
  <text class="s in" x="342" y="106" fill="#EFEEEB" style="animation-delay:0.16s">REACT</text>
  <text class="s in" x="342" y="150" fill="#EFEEEB" style="animation-delay:0.22s">VITE</text>
  <text class="s in" x="616" y="62" fill="#EFEEEB" style="animation-delay:0.20s">GSAP</text>
  <text class="s in" x="616" y="106" fill="#EFEEEB" style="animation-delay:0.26s">PYTHON</text>
  <text class="s in" x="616" y="150" fill="#EFEEEB" style="animation-delay:0.32s">GIT</text>
  <text class="s in" x="890" y="62" fill="#EFEEEB" style="animation-delay:0.30s">FIGMA</text>
  <text class="s in" x="890" y="106" fill="#EFEEEB" style="animation-delay:0.36s">VERCEL</text>
  <text class="s in" x="890" y="150" fill="#EFEEEB" style="animation-delay:0.42s">VS CODE</text>

<rect class="caret" x="972" y="140" width="11" height="17" fill="#B4F53A"/>
</svg>
