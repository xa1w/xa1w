<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400" role="img" aria-label="Tamas Landesz, front-end developer and digital designer">
<title>Tamas Landesz</title>
<defs>
<clipPath id="curtain"><rect x="52" y="96" width="1096" height="180"/></clipPath>
<clipPath id="band"><rect x="0" y="330" width="1200" height="70"/></clipPath>
<clipPath id="wipe"><rect id="wr" x="52" y="96" width="230" height="180"/></clipPath>
<style>
  .s { font-family: ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,monospace;
        font-size: 13px; letter-spacing: 1.6px; }
  .d { font-family: "Helvetica Neue",Helvetica,Arial,"Segoe UI",sans-serif;
        font-weight: 800; font-size: 172px; }

  /* structure draws in: establishes the grid before content lands */
  .rule  { transform-origin: 0 50%; animation: grow .9s cubic-bezier(.22,1,.36,1) both; }
  .vrule { transform-origin: 50% 0;  animation: growy 1.1s cubic-bezier(.22,1,.36,1) both; }
  @keyframes grow  { from { transform: scaleX(0); } }
  @keyframes growy { from { transform: scaleY(0); } }

  /* the name arrives as a curtain lift, not a fade */
  .word { animation: lift 1s cubic-bezier(.22,1,.36,1) .25s both; }
  @keyframes lift { from { transform: translateY(96px); } }

  /* accent sweep: the one moment that pulls the eye to the name */
  #wr { animation: sweep 5.5s cubic-bezier(.65,0,.35,1) 1.2s infinite; }
  @keyframes sweep {
    0%   { x: 52px;   width: 0; }
    28%  { x: 52px;   width: 1096px; }
    58%  { x: 1148px; width: 0; }
    100% { x: 1148px; width: 0; }
  }

  .fade { animation: fade .8s ease-out .7s both; }
  @keyframes fade { from { opacity: 0; } }

  /* breadth without a list */
  .marq { animation: run 22s linear infinite; }
  @keyframes run { to { transform: translateX(-600px); } }

  @media (prefers-reduced-motion: reduce) {
    .rule,.vrule,.word,.fade,.marq,#wr { animation: none; }
    #wr { width: 1096px; }
  }
</style>
</defs>

<rect width="1200" height="400" fill="#F2F1EE"/>

<g stroke="#D8D5CE" stroke-width="1" shape-rendering="crispEdges">
  <line class="vrule" x1="52.5"   y1="0" x2="52.5"   y2="330" style="animation-delay:.05s"/>
  <line class="vrule" x1="417.5"  y1="0" x2="417.5"  y2="330" style="animation-delay:.15s"/>
  <line class="vrule" x1="782.5"  y1="0" x2="782.5"  y2="330" style="animation-delay:.25s"/>
  <line class="vrule" x1="1147.5" y1="0" x2="1147.5" y2="330" style="animation-delay:.35s"/>
  <line class="rule" x1="52" y1="64.5"  x2="1148" y2="64.5"/>
  <line class="rule" x1="52" y1="329.5" x2="1148" y2="329.5" style="animation-delay:.1s"/>
</g>

<g class="s fade" fill="#55555B">
  <text x="68" y="44">FRONT-END / DIGITAL DESIGN</text>
  <text x="1132" y="44" text-anchor="end">OPEN TO INQUIRIES</text>
</g>

<g clip-path="url(#curtain)">
  <g class="word">
    <text class="d" x="52" y="262" fill="#0B0B0C"
          textLength="1096" lengthAdjust="spacingAndGlyphs">LANDESZ</text>
    <g clip-path="url(#wipe)">
      <text class="d" x="52" y="262" fill="#9FE320"
            textLength="1096" lengthAdjust="spacingAndGlyphs">LANDESZ</text>
    </g>
  </g>
</g>

<g class="s fade" fill="#8B887F" style="animation-delay:.9s">
  <text x="68" y="308">TAMAS, 16. RUSSIAN, FRENCH, HUNGARIAN.</text>
  <text x="1132" y="308" text-anchor="end">LANDESZ.DEV</text>
</g>

<g clip-path="url(#band)">
  <rect x="0" y="330" width="1200" height="70" fill="#9FE320"/>
  <g class="marq">
    <text class="s" xml:space="preserve" x="0" y="371" fill="#0B0B0C" textLength="600" lengthAdjust="spacing">PHOTOGRAPHY / FRONT-END / TEDX SPEAKER / ATOMIFYS / MOTION / </text>
      <text class="s" xml:space="preserve" x="600" y="371" fill="#0B0B0C" textLength="600" lengthAdjust="spacing">PHOTOGRAPHY / FRONT-END / TEDX SPEAKER / ATOMIFYS / MOTION / </text>
      <text class="s" xml:space="preserve" x="1200" y="371" fill="#0B0B0C" textLength="600" lengthAdjust="spacing">PHOTOGRAPHY / FRONT-END / TEDX SPEAKER / ATOMIFYS / MOTION / </text>
      <text class="s" xml:space="preserve" x="1800" y="371" fill="#0B0B0C" textLength="600" lengthAdjust="spacing">PHOTOGRAPHY / FRONT-END / TEDX SPEAKER / ATOMIFYS / MOTION / </text>
  </g>
</g>
</svg>
